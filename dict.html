<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>查单词</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:#fff;color:#111;min-height:100vh;
    display:flex;justify-content:center;padding:64px 22px 44px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:400px}

  .eyebrow{font-size:10.5px;letter-spacing:.2em;color:#9a9a9a;text-transform:uppercase}
  h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:12px}

  .tabs{display:flex;gap:18px;margin-top:22px;border-bottom:1px solid #111;padding-bottom:10px}
  .tab{font-size:12.5px;color:#9a9a9a;cursor:pointer;letter-spacing:.04em}
  .tab.on{color:#111}
  .tab i{font-style:normal;font-size:11px;margin-left:4px}

  #q{
    width:100%;margin-top:16px;padding:13px 0;font:inherit;font-size:19px;font-weight:300;
    color:#111;background:transparent;border:0;border-bottom:1px solid #111;outline:0;
  }
  #q::placeholder{color:#c9c9c9;font-weight:300}

  .hint{font-size:11.5px;color:#a5a5a5;margin-top:10px;min-height:16px}

  .list{margin-top:6px}
  .item{padding:14px 0;border-bottom:1px solid #f0f0f0;display:flex;gap:12px;align-items:flex-start}
  .item-body{flex:1;min-width:0}
  .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .word{font-size:16px;font-weight:500;letter-spacing:-.01em}
  .ph{font-size:11.5px;color:#8c8c8c;font-variant-numeric:tabular-nums}
  .tag{font-size:10px;color:#a5a5a5;border:1px solid #e3e3e3;padding:1px 4px;letter-spacing:.04em}
  .trans{font-size:12.5px;color:#4a4a4a;margin-top:6px;line-height:1.65}
  .star{font-size:17px;line-height:1;color:#d5d5d5;cursor:pointer;flex:none;padding-top:2px;user-select:none}
  .star.on{color:#111}
  .empty{font-size:12px;color:#a5a5a5;padding:22px 0}

  footer{margin-top:30px;font-size:11px;line-height:1.8;color:#a5a5a5}
  .link{color:#a5a5a5;text-decoration:underline;cursor:pointer;font-size:11px}
  .err{color:#b3261e}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Words</p>
  <h1>查单词</h1>

  <div class="tabs">
    <span class="tab on" id="tabSearch">查词</span>
    <span class="tab" id="tabBook">生词本<i id="bookCount"></i></span>
  </div>

  <input id="q" placeholder="输入英文或中文" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="hint" id="hint"></p>

  <section class="list" id="list"></section>
  <footer id="foot"></footer>
</main>

<script>
(function(){
  var OWNER = 'MIke648286', REPO = 'checkin-data';
  var BASE = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/';
  var RAW = 'https://raw.githubusercontent.com/MIke648286/checkin-data/main/';
  var BOOK = BASE + 'wordbook.json';

  var TOKEN = '';
  try { TOKEN = localStorage.getItem('checkin.token') || ''; } catch(e){}

  var qEl = document.getElementById('q');
  var hintEl = document.getElementById('hint');
  var listEl = document.getElementById('list');
  var footEl = document.getElementById('foot');
  var tabSearch = document.getElementById('tabSearch');
  var tabBook = document.getElementById('tabBook');

  var WORDS_ALL = [];
  var book = [];
  var bookSha = null;
  var mode = 'search';   // search | book
  var lastQuery = '';

  function b64enc(s){ var b = new TextEncoder().encode(s), bin=''; for(var i=0;i<b.length;i++) bin+=String.fromCharCode(b[i]); return btoa(bin); }
  function b64dec(s){ var bin = atob(s.replace(/\n/g,'')), b = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }
  function H(extra){
    var h = { 'Accept':'application/vnd.github+json' };
    if(TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  async function loadWords(){
    // raw.githubusercontent.com 在国内不通，走 api.github.com 再解 base64
    var r = await fetch(BASE + 'words.json?t=' + Date.now(), { headers: H(), cache:'no-store' });
    if(!r.ok) throw new Error('词库没加载上（' + r.status + '）');
    var j = await r.json();
    var data = JSON.parse(b64dec(j.content));
    if(!Array.isArray(data)) throw new Error('词库格式不对');
    return data;
  }

  async function loadBook(){
    if(!TOKEN) return { list: [], sha: null };
    var r = await fetch(BOOK + '?t=' + Date.now(), { headers: H(), cache:'no-store' });
    if(r.status === 404) return { list: [], sha: null };
    if(!r.ok) throw new Error('生词本读不了（' + r.status + '）');
    var j = await r.json();
    return { list: JSON.parse(b64dec(j.content)), sha: j.sha };
  }

  async function saveBook(){
    if(!TOKEN) throw new Error('没有口令，收藏存不上去');
    var r = await fetch(BOOK, {
      method:'PUT',
      headers: H({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ message:'生词本更新', content: b64enc(JSON.stringify(book)), sha: bookSha || undefined })
    });
    if(!r.ok) throw new Error('收藏没存上（' + r.status + '）');
    var j = await r.json();
    bookSha = j.content.sha;
  }

  function renderItem(w){
    var on = book.indexOf(w.w) > -1;
    return '<div class="item">' +
      '<div class="item-body">' +
        '<div class="head"><span class="word">' + esc(w.w) + '</span>' +
          (w.p ? '<span class="ph">/' + esc(w.p) + '/</span>' : '') +
          (w.tag ? '<span class="tag">' + esc(w.tag) + '</span>' : '') +
        '</div>' +
        '<div class="trans">' + esc(w.t) + '</div>' +
      '</div>' +
      '<span class="star' + (on ? ' on' : '') + '" data-w="' + esc(w.w) + '">' + (on ? '★' : '☆') + '</span>' +
    '</div>';
  }

  function search(q){
    q = (q || '').trim().toLowerCase();
    if(!q) return [];
    var starts = [], contains = [], cn = [];
    for(var i=0;i<WORDS_ALL.length;i++){
      var w = WORDS_ALL[i], lw = w.w.toLowerCase();
      if(lw === q){ starts.unshift(w); continue; }
      if(lw.indexOf(q) === 0) starts.push(w);
      else if(lw.indexOf(q) > -1) contains.push(w);
      else if((w.t || '').indexOf(q) > -1) cn.push(w);
    }
    return starts.concat(contains, cn).slice(0, 40);
  }

  function render(){
    if(mode === 'book'){
      var items = book.map(function(w){ return WORDS_ALL.filter(function(x){ return x.w === w; })[0]; })
        .filter(Boolean);
      listEl.innerHTML = items.length
        ? items.map(renderItem).join('')
        : '<p class="empty">生词本还是空的。查词的时候点右边的 ☆ 就能收进来。</p>';
      hintEl.textContent = items.length ? '收着 ' + items.length + ' 个' : '';
      return;
    }
    var q = qEl.value;
    if(!q.trim()){
      listEl.innerHTML = '<p class="empty">输个词试试，中文也行（比如「放弃」「能力」）。</p>';
      hintEl.textContent = '';
      return;
    }
    var res = search(q);
    listEl.innerHTML = res.length ? res.map(renderItem).join('')
      : '<p class="empty">没找到。这个词可能不在这 3920 个四六级词里。</p>';
    hintEl.textContent = res.length ? res.length + ' 个结果' : '';
  }

  function setMode(m){
    mode = m;
    tabSearch.className = 'tab' + (m === 'search' ? ' on' : '');
    tabBook.className = 'tab' + (m === 'book' ? ' on' : '');
    qEl.style.display = m === 'search' ? '' : 'none';
    render();
  }

  var timer = null;
  qEl.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });

  listEl.addEventListener('click', async function(e){
    var star = e.target.closest('.star');
    if(!star) return;
    var w = star.dataset.w;
    if(!TOKEN){
      hintEl.innerHTML = '<span class="err">收藏要先去打卡页贴一次口令</span>';
      return;
    }
    var at = book.indexOf(w);
    if(at > -1) book.splice(at, 1); else book.push(w);
    renderBookCount();
    render();
    try{ await saveBook(); }
    catch(err){
      // 存不上就退回去
      if(at > -1) book.splice(at, 0, w); else book.splice(book.indexOf(w), 1);
      renderBookCount(); render();
      hintEl.innerHTML = '<span class="err">' + err.message + '</span>';
    }
  });

  tabSearch.addEventListener('click', function(){ setMode('search'); });
  tabBook.addEventListener('click', function(){ setMode('book'); });

  function renderBookCount(){
    document.getElementById('bookCount').textContent = book.length ? book.length : '';
  }

  (async function init(){
    try{
      var both = await Promise.all([loadWords(), loadBook()]);
      WORDS_ALL = both[0];
      book = both[1].list || [];
      bookSha = both[1].sha;
      renderBookCount();
      render();
      footEl.innerHTML = WORDS_ALL.length + ' 个四六级词 · 点 ☆ 收进生词本，存在同一个仓库里<br>' +
        '<a class="link" href="./" style="color:#a5a5a5">去打卡页</a>　<a class="link" href="ledger.html" style="color:#a5a5a5">记账</a>';
    }catch(e){
      listEl.innerHTML = '<p class="empty err">' + e.message + '，刷新再试。</p>';
    }
  })();
})();
</script>
</body>
</html>
