<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>打卡</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:#fff;color:#111;min-height:100vh;
    display:flex;justify-content:center;padding:64px 22px 44px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:400px}

  .eyebrow{font-size:10.5px;letter-spacing:.2em;color:#9a9a9a;text-transform:uppercase}
  h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:12px}
  .rule{height:1px;background:#111;opacity:.12;margin:22px 0 0}

  .whoami{font-size:11.5px;letter-spacing:.04em;color:#9a9a9a;margin-top:18px;min-height:15px}
  .whoami b{color:#111;font-weight:500}
  .progress{display:flex;align-items:baseline;gap:5px;margin-top:8px;font-size:12px;letter-spacing:.04em;color:#9a9a9a;min-height:16px}
  .progress b{font-size:12px;font-weight:500;color:#111;font-variant-numeric:tabular-nums;letter-spacing:0}

  .card{border:1px solid #e7e7e7;padding:18px 20px 16px;margin-top:12px}
  .card.me{border-color:#111}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .name{font-size:14.5px;font-weight:500;padding:1px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .state{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;color:#9a9a9a;white-space:nowrap}
  .dot{width:5px;height:5px;border-radius:50%;border:1px solid #111}
  .dot.on{background:#111}
  .card.today .state{color:#111}

  .count{display:flex;align-items:baseline;gap:8px;margin-top:18px}
  .num{font-size:48px;font-weight:300;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .unit{font-size:11.5px;letter-spacing:.12em;color:#8c8c8c}
  .hint{font-size:11.5px;color:#9a9a9a;margin-top:8px;min-height:16px}

  button{
    width:100%;margin-top:18px;padding:12px;font:inherit;font-size:12.5px;letter-spacing:.1em;
    background:#111;color:#fff;border:1px solid #111;border-radius:0;cursor:pointer;
    transition:background .15s,color .15s;
  }
  button:hover{background:#333}
  button.done{background:#fff;color:#111}
  button.done:hover{background:#f6f6f6}
  button:disabled{opacity:.45;cursor:default}

  .pick{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  .pick button{margin-top:0;padding:16px}

  input.txt{
    width:100%;margin-top:14px;padding:13px 12px;font:inherit;font-size:12.5px;
    border:1px solid #ddd;border-radius:0;outline:0;color:#111;
  }
  input.txt:focus{border-color:#111}

  input.note{
    width:100%;margin-top:14px;padding:9px 0;font:inherit;font-size:12.5px;color:#111;
    background:transparent;border:0;border-bottom:1px solid #e7e7e7;outline:0;
  }
  input.note::placeholder{color:#c0c0c0}
  input.note:focus{border-bottom-color:#111}

  .setup{font-size:12px;line-height:1.85;color:#6b6b6b;margin-top:14px}
  .setup a{color:#111}
  .setup ol{padding-left:18px;margin-top:8px}
  .setup li{margin-bottom:4px}

  .cal{margin-top:28px}
  .cal-title{font-size:10.5px;letter-spacing:.2em;color:#9a9a9a;text-transform:uppercase}
  .cal-row{display:flex;align-items:center;gap:12px;margin-top:10px}
  .cal-name{font-size:11px;color:#8c8c8c;width:46px;flex:none}
  .cells{display:flex;gap:3px;flex:1}
  .cell{height:10px;flex:1;background:#ededed;cursor:pointer}
  .cell.on{background:#111}
  .cell.today{outline:1px solid #111;outline-offset:1px}
  .cal-foot{font-size:10.5px;color:#b0b0b0;margin-top:8px;letter-spacing:.04em}
  .cal-note{font-size:12px;color:#111;margin-top:12px;min-height:18px;line-height:1.6}
  .cal-note span{color:#9a9a9a;font-size:11px;margin-right:6px}

  .report{margin-top:32px;border-top:1px solid #111;opacity:.999;padding-top:16px}
  .rep-title{font-size:10.5px;letter-spacing:.2em;color:#9a9a9a;text-transform:uppercase}
  .rep-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:12.5px}
  .rep-name{color:#111}
  .rep-num{font-variant-numeric:tabular-nums;color:#111}
  .rep-num em{font-style:normal;color:#9a9a9a;font-size:11px;margin-left:6px}
  .rep-foot{font-size:10.5px;color:#b0b0b0;margin-top:12px}

  footer{margin-top:28px;font-size:11px;line-height:1.8;color:#a5a5a5}
  .err{color:#b3261e}
  .link{color:#a5a5a5;text-decoration:underline;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Daily Check-in</p>
  <h1 id="date">—</h1>
  <div class="rule"></div>
  <div class="whoami" id="whoami"></div>
  <div class="progress" id="progress"></div>
  <section id="cards"></section>
  <section id="calendar"></section>
  <section id="report"></section>
  <footer id="foot"></footer>
</main>

<script>
(function(){
  var OWNER = 'MIke648286', REPO = 'checkin-data';
  var BASE = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/';
  var NAMES = ['自助餐', '大菲菲'];
  var MOCK = /[?&]mock=1/.test(location.search);

  var WEEK = ['日','一','二','三','四','五','六'];
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var dk = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

  var today = new Date();
  document.getElementById('date').textContent =
    (today.getMonth()+1) + '月' + today.getDate() + '日 · 周' + WEEK[today.getDay()];

  var cards = document.getElementById('cards');
  var calEl = document.getElementById('calendar');
  var repEl = document.getElementById('report');
  var progressEl = document.getElementById('progress');
  var footEl = document.getElementById('foot');

  var TOKEN = '', who = 0;
  try {
    TOKEN = localStorage.getItem('checkin.token') || '';
    who = +localStorage.getItem('checkin.who') || 0;
  } catch(e){}
  var mu = location.search.match(/[?&]u=([12])\b/);
  if(mu){ who = +mu[1]; try{ localStorage.setItem('checkin.who', mu[1]); }catch(e){} }

  function b64enc(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec(s){
    var bin = atob(s.replace(/\n/g,'')), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function H(extra){
    var h = { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + TOKEN };
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }

  // 老数据是 ["2026-11-25"]，新数据是 [{d:"2026-11-25", n:"留言"}]，都认
  function norm(list){
    return (list || []).map(function(x){
      if(typeof x === 'string') return { d: x, n: '' };
      if(x && x.d) return { d: x.d, n: x.n || '' };
      return null;
    }).filter(Boolean);
  }

  var mockEntries = { 1: [], 2: [] };
  if(MOCK){
    var back = function(k){ var d = new Date(); d.setDate(d.getDate()-k); return dk(d); };
    mockEntries = {
      1:[{d:back(0),n:'今天好困还是背完了'},{d:back(1),n:''},{d:back(2),n:''},{d:back(3),n:''}],
      2:[{d:back(0),n:'先打了，你快点'}]
    };
  }

  function fileUrl(w){ return BASE + 'u' + w + '.json'; }

  async function readOne(w){
    if(MOCK) return { entries: norm(mockEntries[w]), sha: 'mock' };
    var r = await fetch(fileUrl(w) + '?t=' + Date.now(), { headers: H(), cache:'no-store' });
    if(r.status === 404) return { entries: [], sha: null };
    if(!r.ok) throw new Error('读取失败（' + r.status + '）');
    var j = await r.json();
    return { entries: norm(JSON.parse(b64dec(j.content))), sha: j.sha };
  }

  async function writeOne(w, entries, sha){
    if(MOCK){ mockEntries[w] = entries.slice(); return; }
    var r = await fetch(fileUrl(w), {
      method: 'PUT',
      headers: H({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ message: '打卡 ' + dk(new Date()), content: b64enc(JSON.stringify(entries)), sha: sha || undefined })
    });
    if(!r.ok) throw new Error('保存失败（' + r.status + '）');
  }

  var lastWrite = null; // { who, day, added, at }

  async function toggle(w){
    var t = dk(new Date());
    for(var attempt = 0; attempt < 2; attempt++){
      var r = await readOne(w);
      var entries = r.entries.slice();
      var at = entries.findIndex(function(e){ return e.d === t; });
      var added = at === -1;
      if(added) entries.push({ d: t, n: '' }); else entries.splice(at, 1);
      try { await writeOne(w, entries, r.sha); return { entries: entries, added: added }; }
      catch(e){ if(attempt === 1) throw e; }
    }
  }

  async function saveNote(w, day, note){
    for(var attempt = 0; attempt < 2; attempt++){
      var r = await readOne(w);
      var entries = r.entries.slice();
      var e = entries.find(function(x){ return x.d === day; });
      if(!e) return;
      e.n = note;
      try { await writeOne(w, entries, r.sha); return; }
      catch(err){ if(attempt === 1) throw err; }
    }
  }

  function dayList(entries){ return entries.map(function(e){ return e.d; }); }

  function streak(days){
    var set = new Set(days), d = new Date();
    if(!set.has(dk(d))) d.setDate(d.getDate()-1);
    var n = 0;
    while(set.has(dk(d))){ n++; d.setDate(d.getDate()-1); }
    return n;
  }

  function renderSetup(){
    progressEl.textContent = '';
    document.getElementById('whoami').textContent = '';
    calEl.innerHTML = ''; repEl.innerHTML = '';
    cards.innerHTML =
      '<div class="setup">第一次用要贴一串口令。生成一次就好，两个人的手机上各贴一次。</div>' +
      '<ol class="setup">' +
        '<li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">这个页面</a></li>' +
        '<li>Token name 随便填，Expiration 选 No expiration</li>' +
        '<li>Repository access 选 Only select repositories，勾 <b>checkin-data</b></li>' +
        '<li>Permissions → Contents 选 <b>Read and write</b></li>' +
        '<li>Generate token，把 ghp_ 开头的那串复制过来</li>' +
      '</ol>' +
      '<input class="txt" id="tk" placeholder="粘贴口令" autocomplete="off" spellcheck="false">' +
      '<p class="hint" id="note" style="color:#b3261e"></p>' +
      '<button id="saveTk">存到这台设备</button>';
  }

  function renderPick(){
    progressEl.textContent = '';
    document.getElementById('whoami').textContent = '';
    calEl.innerHTML = ''; repEl.innerHTML = '';
    cards.innerHTML =
      '<p class="hint" style="margin-top:24px">你是哪一位？点一次就好。</p>' +
      '<div class="pick">' +
        '<button data-who="1">' + NAMES[0] + '</button>' +
        '<button data-who="2">' + NAMES[1] + '</button>' +
      '</div>';
  }

  function recentDays(n){
    var out = [];
    for(var i = n-1; i >= 0; i--){ var x = new Date(); x.setDate(x.getDate() - i); out.push(dk(x)); }
    return out;
  }

  function renderCalendar(e1, e2){
    var days = recentDays(30), t = dk(new Date());
    var setA = new Set(dayList(e1)), setB = new Set(dayList(e2));
    var html = '<p class="cal-title">最近 30 天</p>';
    [[NAMES[0], setA, e1], [NAMES[1], setB, e2]].forEach(function(pair, idx){
      html += '<div class="cal-row"><span class="cal-name">' + pair[0] + '</span><span class="cells">';
      days.forEach(function(d){
        var cls = 'cell' + (pair[1].has(d) ? ' on' : '') + (d === t ? ' today' : '');
        html += '<span class="' + cls + '" data-d="' + d + '" data-w="' + (idx+1) + '"></span>';
      });
      html += '</span></div>';
    });
    html += '<p class="cal-foot">左到右 = 从 ' + days[0].slice(5).replace('-','月') + '日 到今天，点格子看那天的留言</p>';
    html += '<p class="cal-note" id="calNote"></p>';
    calEl.innerHTML = html;
  }

  function monthStats(entries, ym){
    var list = entries.filter(function(e){ return e.d.indexOf(ym) === 0; }).map(function(e){ return e.d; }).sort();
    var max = 0, cur = 0, prev = null;
    list.forEach(function(d){
      if(prev){
        var p = new Date(prev + 'T00:00:00'), c = new Date(d + 'T00:00:00');
        var gap = Math.round((c - p) / 86400000);
        cur = gap === 1 ? cur + 1 : 1;
      } else cur = 1;
      if(cur > max) max = cur;
      prev = d;
    });
    return { count: list.length, max: max };
  }

  function renderReport(e1, e2){
    var y = today.getFullYear(), m = today.getMonth() + 1;
    var ym = y + '-' + pad(m);
    var a = monthStats(e1, ym), b = monthStats(e2, ym);
    var html = '<p class="rep-title">' + m + ' 月战报</p>';
    [[NAMES[0], a], [NAMES[1], b]].forEach(function(pair){
      html += '<div class="rep-row"><span class="rep-name">' + pair[0] + '</span>' +
        '<span class="rep-num">' + pair[1].count + ' 天<em>最长连 ' + pair[1].max + ' 天</em></span></div>';
    });
    html += '<p class="rep-foot">到今天为止，这个月打了几天</p>';
    repEl.innerHTML = html;
  }

  function render(data){
    var t = dk(new Date());
    var mine = data['u' + who] || [];
    var other = data['u' + (who === 1 ? 2 : 1)] || [];
    var mineDays = dayList(mine), otherDays = dayList(other);
    var doneMine = mineDays.indexOf(t) > -1;
    var doneOther = otherDays.indexOf(t) > -1;
    var doneCount = (doneMine ? 1 : 0) + (doneOther ? 1 : 0);

    document.getElementById('whoami').innerHTML = '你是 <b>' + NAMES[who-1] + '</b>';
    progressEl.innerHTML = '今天已打卡 <b>' + doneCount + '</b><span>/ 2</span>';
    cards.innerHTML = '';

    [1,2].forEach(function(w){
      var isMe = w === who;
      var entries = isMe ? mine : other;
      var done = isMe ? doneMine : doneOther;
      var n = streak(dayList(entries));

      var hint;
      if(done) hint = isMe ? '点按钮可以撤销' : '今天已经打过了';
      else if(n > 0) hint = isMe ? ('今天是第 ' + (n+1) + ' 天，不打就断') : ('今天还没打，连着 ' + n + ' 天了');
      else hint = isMe ? '点一下就算打过' : '今天还没打';

      var myNote = isMe && done ? (entries.find(function(e){ return e.d === t; }) || {}).n || '' : '';

      var card = document.createElement('div');
      card.className = 'card' + (done ? ' today' : '') + (isMe ? ' me' : '');
      card.innerHTML =
        '<div class="row">' +
          '<div class="name">' + NAMES[w-1] + '</div>' +
          '<div class="state"><span class="dot' + (done?' on':'') + '"></span>' + (done ? '已打卡' : '未打卡') + '</div>' +
        '</div>' +
        '<div class="count"><span class="num">' + n + '</span><span class="unit">天连续</span></div>' +
        '<p class="hint">' + hint + '</p>' +
        (isMe && done ? '<input class="note" id="noteToday" placeholder="给今天留一句，不写也行" value="' + myNote.replace(/"/g,'&quot;') + '" maxlength="40">' : '') +
        (isMe ? '<button class="' + (done?'done':'') + '" data-act="' + (done?'undo':'in') + '">' + (done ? '已打卡' : '打卡') + '</button>' : '');
      cards.appendChild(card);
    });

    renderCalendar(mine, other);
    renderReport(mine, other);

    footEl.innerHTML = '两个人各存各的记录，同时点也不会互相覆盖。<br>' +
      '<span class="link" id="export">导出记录</span>　<span class="link" id="resetAll">换口令 / 换身份</span>';
  }

  var seq = 0;
  async function refresh(){
    if(!TOKEN){
      if(!document.getElementById('tk')) renderSetup();
      return;
    }
    if(!who){ renderPick(); return; }
    var my = ++seq;
    try{
      var a = await readOne(1), b = await readOne(2);
      if(my !== seq) return;
      var data = { u1: a.entries, u2: b.entries };
      if(lastWrite && Date.now() - lastWrite.at < 120000){
        var k = 'u' + lastWrite.who;
        var list = (data[k] || []).slice();
        var has = list.some(function(e){ return e.d === lastWrite.day; });
        if(has !== lastWrite.added){
          data[k] = lastWrite.added
            ? list.concat([{ d: lastWrite.day, n: '' }])
            : list.filter(function(e){ return e.d !== lastWrite.day; });
        }
      }
      render(data);
    }catch(e){
      if(my !== seq) return;
      footEl.innerHTML = '<span class="err">' + (e.message || '连不上') + '，稍后刷新再试。</span>';
    }
  }

  cards.addEventListener('click', async function(e){
    var save = e.target.closest('#saveTk');
    if(save){
      var note = document.getElementById('note');
      var v = (document.getElementById('tk').value || '').trim();
      if(!v){ note.textContent = '先把口令粘贴到上面的框里'; return; }
      save.disabled = true;
      save.textContent = '检查中…';
      note.textContent = '';
      TOKEN = v;
      try { await readOne(1); }
      catch(err) {
        TOKEN = '';
        save.disabled = false;
        save.textContent = '存到这台设备';
        note.textContent = '口令不对，或者没给 checkin-data 的 Contents 读写权限';
        return;
      }
      try{ localStorage.setItem('checkin.token', v); }catch(err){}
      refresh();
      return;
    }
    var pick = e.target.closest('button[data-who]');
    if(pick){
      who = +pick.dataset.who;
      try{ localStorage.setItem('checkin.who', String(who)); }catch(err){}
      history.replaceState(null, '', '?u=' + who);
      refresh();
      return;
    }
    var btn = e.target.closest('button[data-act]');
    if(btn){
      btn.disabled = true;
      btn.textContent = btn.dataset.act === 'in' ? '打卡中…' : '撤销中…';
      try{
        var r = await toggle(who);
        if(r){
          lastWrite = { who: who, day: dk(new Date()), added: r.added, at: Date.now() };
          var a = await readOne(1), b = await readOne(2);
          var data = { u1: a.entries, u2: b.entries };
          data['u' + who] = r.entries;
          render(data);
        }
        setTimeout(refresh, 4000);
      }
      catch(err){ footEl.innerHTML = '<span class="err">' + err.message + '，再点一次试试。</span>'; btn.disabled = false; btn.textContent = '打卡'; }
    }
    // 点日历格子看那天的话
    var cell = e.target.closest('.cell');
    if(cell){
      var d = cell.dataset.d, w = +cell.dataset.w;
      var list = w === who ? (await readOne(who)).entries : (await readOne(w)).entries;
      var item = list.find(function(x){ return x.d === d; });
      var noteBox = document.getElementById('calNote');
      if(!noteBox) return;
      var label = d.slice(5).replace('-', '月') + '日 · ' + NAMES[w-1];
      if(!item) noteBox.innerHTML = '<span>' + label + '</span>那天没打卡';
      else if(!item.n) noteBox.innerHTML = '<span>' + label + '</span>打了卡，没留话';
      else noteBox.innerHTML = '<span>' + label + '</span>' + item.n;
    }
  });

  cards.addEventListener('change', async function(e){
    if(e.target.id !== 'noteToday') return;
    var v = (e.target.value || '').trim();
    try { await saveNote(who, dk(new Date()), v); }
    catch(err){ footEl.innerHTML = '<span class="err">留言没存上，再试一次。</span>'; }
  });

  document.addEventListener('click', async function(e){
    if(e.target.id === 'export'){
      try{
        var a = await readOne(1), b = await readOne(2);
        var out = {};
        out[NAMES[0]] = a.entries; out[NAMES[1]] = b.entries;
        var blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = '打卡记录-' + dk(new Date()) + '.json';
        link.click();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      }catch(err){ footEl.innerHTML = '<span class="err">导出失败，稍后再试。</span>'; }
      return;
    }
    if(e.target.id === 'resetAll'){
      try{ localStorage.removeItem('checkin.token'); localStorage.removeItem('checkin.who'); }catch(err){}
      TOKEN = ''; who = 0;
      refresh();
    }
  });

  refresh();
  setInterval(function(){ if(document.visibilityState === 'visible') refresh(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
